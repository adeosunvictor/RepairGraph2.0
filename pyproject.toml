[project]
name = "repairgraph"
version = "2.0.0"
description = "RepairGraph 2.0: evaluated multi-agent software diagnosis and repair engineer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "httpx>=0.27",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "PyGithub>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
security = [
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
repairgraph = "repairgraph.main:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [
  ".venv",
  ".repairgraph",
  "evals",
  "dist",
  "build"
]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repairgraph"]